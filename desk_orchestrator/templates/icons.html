{% macro icon(name) -%}
<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'monitor' %}<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M7 8h5"/>
{% elif name == 'briefcase' %}<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12l9 3 9-3m-9 1v4"/>
{% elif name == 'gamepad' %}<path d="M7 7h10c3 0 4 4 5 10 .5 3-2 4-4 2l-3-3H9l-3 3c-2 2-4.5 1-4-2 1-6 2-10 5-10Z"/><path d="M6 10v4m-2-2h4m8-1h.01m3 2h.01M9 7l1-3h4l1 3"/>
{% elif name == 'disc' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M5.7 10a7 7 0 0 1 4.3-4.3M14 18.3a7 7 0 0 0 4.3-4.3"/>
{% elif name == 'record' %}<circle cx="10" cy="12" r="8"/><circle cx="10" cy="12" r="2"/><path d="M5 12a5 5 0 0 1 5-5m12-3v10l-4 4h-3"/>
{% elif name == 'overview' %}<rect x="3" y="3" width="7" height="10" rx="1.5"/><rect x="14" y="3" width="7" height="6" rx="1.5"/><rect x="3" y="17" width="7" height="4" rx="1.5"/><rect x="14" y="13" width="7" height="8" rx="1.5"/>
{% elif name == 'numpad' %}<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6m-6 4h.01M12 10h.01M15 10h.01M9 14h.01M12 14h.01M15 14v4m-6 0h3"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--surface-low)"/><circle cx="16" cy="17" r="3" fill="var(--surface-low)"/>
{% elif name == 'audio' %}<rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="15" r="4"/><circle cx="12" cy="6" r="1"/>
{% elif name == 'switch' %}<path d="M3 7h18l-4-4m4 14H3l4 4M3 7v5m18 5v-5"/>
{% elif name == 'map' %}<circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9M6.3 8.2l4.4 7.6m6.9-7.6-4.4 7.6"/>
{% elif name == 'chip' %}<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>
{% elif name == 'activity' %}<path d="M2 12h5l3-8 4 16 3-8h5"/>
{% else %}<path d="m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5"/>{% endif %}
</svg>
{%- endmacro %}
