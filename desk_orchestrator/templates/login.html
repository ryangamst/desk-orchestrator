<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Desk Orchestrator</title><link rel="icon" type="image/svg+xml" sizes="any" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}"></head><body class="login-page"><main class="login-card"><span class="brand-mark">d<span>.</span></span><h1>Sign in</h1><p>Desk Orchestrator</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Controller password<input type="password" name="password" required autocomplete="current-password" autofocus></label><button class="button primary">Sign in</button></form><p class="hint">Use the password set on your Raspberry Pi.</p></main></body></html>
