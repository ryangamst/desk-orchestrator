[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-orchestrator"
version = "0.1.0"
description = "Raspberry Pi desk scenes for SmartThings, LIRC, USB HID, and a numpad"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
keypad = ["evdev>=1.7,<2"]
serial = ["pyserial>=3.5,<4"]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]
tls = ["certbot>=5,<6", "cheroot>=10,<12", "dnspython>=2.6,<3", "cryptography>=43"]

[project.scripts]
desk = "desk_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["desk_orchestrator*"]

[tool.setuptools.package-data]
desk_orchestrator = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
